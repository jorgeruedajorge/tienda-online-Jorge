{% extends "base.html" %}

{% block titulo %}
Nuevo Producto
{% endblock %}

{% block content %}

<h1 class="mb-4">
    Agregar Producto
</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">
            Tipo de producto
        </label>

        <select
            name="tipo"
            class="form-select"
            required>

            <option value="fisico">
                Físico
            </option>

            <option value="digital">
                Digital
            </option>

            <option value="perecible">
                Perecible
            </option>

        </select>
    </div>


    <div class="mb-3">
        <label class="form-label">
            Código
        </label>

        <input
            type="text"
            name="codigo"
            class="form-control"
            required>
    </div>


    <div class="mb-3">
        <label class="form-label">
            Nombre
        </label>

        <input
            type="text"
            name="nombre"
            class="form-control"
            required>
    </div>


    <div class="mb-3">
        <label class="form-label">
            Precio base
        </label>

        <input
            type="number"
            step="0.01"
            name="precio_base"
            class="form-control"
            required>
    </div>


    <div class="mb-3">
        <label class="form-label">
            Stock
        </label>

        <input
            type="number"
            name="stock"
            class="form-control"
            required>
    </div>


    <div class="mb-3">
        <label class="form-label">
            Peso (kg)
        </label>

        <input
            type="number"
            step="0.01"
            name="peso_kg"
            class="form-control">
    </div>


    <div class="mb-3">
        <label class="form-label">
            Costo de envío por kg
        </label>

        <input
            type="number"
            step="0.01"
            name="costo_envio_por_kg"
            class="form-control">
    </div>


    <div class="mb-3">
        <label class="form-label">
            Licencia
        </label>

        <select
            name="licencia"
            class="form-select">

            <option value="personal">
                Personal
            </option>

            <option value="comercial">
                Comercial
            </option>

            <option value="educativa">
                Educativa
            </option>

        </select>
    </div>


    <div class="mb-3">
        <label class="form-label">
            Días para vencer
        </label>

        <input
            type="number"
            name="dias_para_vencer"
            class="form-control">
    </div>


    <button
        type="submit"
        class="btn btn-success">

        Guardar producto

    </button>


    <a
        href="{{ url_for('inicio') }}"
        class="btn btn-secondary">

        Cancelar

    </a>

</form>

{% endblock %}
