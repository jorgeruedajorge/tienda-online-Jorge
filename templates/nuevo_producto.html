{% extends "base.html" %}

{% block titulo %}
Nuevo Producto
{% endblock %}

{% block content %}

<div class="container">

    <h1 class="mb-4 page-title">
        Agregar Producto
    </h1>

    <div class="card form-card shadow-sm p-3 p-md-4 mb-4">
<form
        method="POST"
        enctype="multipart/form-data"
    >

        <!-- Tipo de producto -->
        <div class="mb-3">

            <label class="form-label">
                Tipo de producto
            </label>

            <select
                name="tipo"
                class="form-select"
                required>

                <option value="fisico">
                    Físico
                </option>

                <option value="digital">
                    Digital
                </option>

                <option value="perecible">
                    Perecible
                </option>

            </select>

        </div>


        <!-- Código -->
        <div class="mb-3">

            <label class="form-label">
                Código
            </label>

            <input
                type="text"
                name="codigo"
                class="form-control"
                placeholder="Ej. PER001"
                required>

        </div>


        <!-- Nombre -->
        <div class="mb-3">

            <label class="form-label">
                Nombre
            </label>

            <input
                type="text"
                name="nombre"
                class="form-control"
                placeholder="Nombre del producto"
                required>

        </div>


        <!-- Precio -->
        <div class="mb-3">

            <label class="form-label">
                Precio base
            </label>

            <input
                type="number"
                step="0.01"
                min="0"
                name="precio_base"
                class="form-control"
                placeholder="0.00"
                required>

        </div>


        <!-- Stock -->
        <div class="mb-3">

            <label class="form-label">
                Stock
            </label>

            <input
                type="number"
                min="0"
                name="stock"
                class="form-control"
                placeholder="Cantidad disponible"
                required>

        </div>


        <!-- IMAGEN DEL PRODUCTO -->
        <div class="mb-4">

            <label class="form-label fw-bold">
                Imagen del producto
            </label>

            <input
                type="file"
                name="imagen"
                class="form-control"
                accept=".png,.jpg,.jpeg,.gif,.webp"
            >

            <div class="form-text">
                Puedes subir una imagen en formato
                PNG, JPG, JPEG, GIF o WEBP.
            </div>

        </div>


        <!-- Peso -->
        <div class="mb-3">

            <label class="form-label">
                Peso (kg)
            </label>

            <input
                type="number"
                step="0.01"
                min="0"
                name="peso_kg"
                class="form-control">

        </div>


        <!-- Costo de envío -->
        <div class="mb-3">

            <label class="form-label">
                Costo de envío por kg
            </label>

            <input
                type="number"
                step="0.01"
                min="0"
                name="costo_envio_por_kg"
                class="form-control">

        </div>


        <!-- Licencia -->
        <div class="mb-3">

            <label class="form-label">
                Licencia
            </label>

            <select
                name="licencia"
                class="form-select">

                <option value="personal">
                    Personal
                </option>

                <option value="comercial">
                    Comercial
                </option>

                <option value="educativa">
                    Educativa
                </option>

            </select>

        </div>


        <!-- Días para vencer -->
        <div class="mb-3">

            <label class="form-label">
                Días para vencer
            </label>

            <input
                type="number"
                min="0"
                name="dias_para_vencer"
                class="form-control">

        </div>


        <!-- Botones -->
        <div class="d-flex gap-2">

            <button
                type="submit"
                class="btn btn-success">

                🖼️ Guardar producto

            </button>


            <a
                href="{{ url_for('inicio') }}"
                class="btn btn-secondary">

                Cancelar

            </a>

        </div>

    </form>

</div>

{% endblock %}
