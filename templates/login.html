{% extends "base.html" %}

{% block titulo %}
Iniciar Sesión
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body p-4">

                <h2 class="text-center mb-4">
                    🔐 Iniciar Sesión
                </h2>


                <form method="POST">

                    <!-- CORREO -->

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label">

                            Correo electrónico

                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="correo@ejemplo.com"
                            required>

                    </div>


                    <!-- CONTRASEÑA -->

                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label">

                            Contraseña

                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Ingresa tu contraseña"
                            required>

                    </div>


                    <!-- BOTÓN -->

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Iniciar sesión

                    </button>

                </form>


                <!-- REGISTRO -->

                <div class="text-center mt-4">

                    <p class="mb-0">

                        ¿No tienes una cuenta?

                        <a
                            href="{{ url_for('registro') }}">

                            Regístrate

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
